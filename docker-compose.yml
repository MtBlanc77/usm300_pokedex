version: '3.8'
services:
  jenkins:
    image: jenkinscicd:1.2
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkinsdata:/var/jenkins_home
    networks:
      - cicd-net

  sonarqube:
    image: sonarqube:lts
    ports:
      - "9000:9000"
    networks:
      - cicd-net
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
    networks:
      - cicd-net

volumes:
  jenkinsdata:

networks:
  cicd-net:
